<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" data-i18n-attr="content:meta.description" />
    <title></title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="assets/brand/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,200;0,300;0,500;0,600;1,400&family=Roboto:wght@300;400;500&family=Work+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header" data-i18n-attr="aria-label:header.ariaLabel">
      <a class="brand" href="#top" data-i18n="brand.name" data-i18n-attr="aria-label:brand.ariaLabel"></a>
      <nav class="nav-links" id="nav-links"></nav>
    </header>

    <main id="top" class="main-container">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-media" data-i18n-attr="aria-label:hero.mediaAriaLabel">
          <video class="hero-video" src="assets/hero/hero-video-2026.mp4" autoplay muted loop playsinline></video>
          <div class="hero-fallback">
            <span data-i18n="hero.mediaPlaceholder"></span>
          </div>
        </div>

        <div class="hero-copy">
          <p class="kicker" data-i18n="hero.kicker"></p>
          <h1 id="hero-title" data-i18n="hero.title"></h1>
        </div>

        <a class="hero-scroll-cue" href="#artist" data-i18n-attr="aria-label:hero.scrollCueAriaLabel">
          <picture class="scroll-cue-media" aria-hidden="true">
            <source srcset="assets/hero/scroll-down-cue-static.svg" media="(prefers-reduced-motion: reduce)" />
            <img src="assets/hero/scroll-down-cue.svg" alt="" />
          </picture>
          <span class="scroll-cue-label" data-i18n="hero.scrollCueText"></span>
        </a>
      </section>

      <section class="section artist-section reveal" id="artist">
        <p class="section-ghost rotate" data-i18n="artist.ghost"></p>
        <div class="section-copy">
          <p class="eyebrow" data-i18n="artist.eyebrow"></p>
          <h2 data-i18n="artist.heading"></h2>
          <div id="artist-body"></div>
        </div>
      </section>

      <section class="section skills-section reveal" id="skills">
        <p class="section-ghost" data-i18n="skills.ghost"></p>
        <div id="skill-cards"></div>
      </section>

      <section class="section projects-section reveal" id="projects" aria-labelledby="projects-title">
        <p class="section-ghost" data-i18n="projectsSection.ghost"></p>
        <div class="projects-intro">
          <h2 class="eyebrow" id="projects-title" data-i18n="projectsSection.eyebrow"></h2>
        </div>
        <div class="project-groups" id="project-groups"></div>
      </section>

      <section class="section contact-section reveal" id="contact">
        <p class="section-ghost" data-i18n="contact.ghost"></p>
        <p class="contact-note" data-i18n="contact.note"></p>
        <div class="contact-links" id="contact-links" data-i18n-attr="aria-label:contact.linksAriaLabel"></div>
        <div class="contact-media">
          <span data-i18n="contact.mediaPlaceholder"></span>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p><span data-i18n="footer.copyrightPrefix"></span> <span id="year"></span> <span data-i18n="footer.copyrightSuffix"></span></p>
    </footer>

    <dialog class="project-video-dialog" data-project-video-dialog aria-labelledby="project-video-dialog-title">
      <div class="project-video-dialog-shell">
        <button class="project-media-dialog-close" type="button" data-project-video-dialog-close>Close video</button>
        <div class="project-video-dialog-frame">
          <iframe
            data-project-video-dialog-frame
            title=""
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
            allowfullscreen
          ></iframe>
        </div>
        <div class="project-video-dialog-footer">
          <h2 id="project-video-dialog-title" data-project-video-dialog-title></h2>
          <a data-project-video-dialog-link target="_blank" rel="noreferrer">View project</a>
        </div>
      </div>
    </dialog>

    <script src="project-authoring.js"></script>
    <script src="media-playback.js"></script>
    <script src="script.js"></script>
  </body>
</html>
