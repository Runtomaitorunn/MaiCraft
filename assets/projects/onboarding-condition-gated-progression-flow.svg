<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title flow-desc" viewBox="0 0 1400 760">
  <title id="flow-title">Condition-Gated Progression Flow</title>
  <desc id="flow-desc">A UML-like activity diagram for a condition-gated onboarding panel. It follows the EntryAudioConditionHintLoopPanel and OnboardingTaskPanel coroutine path: reset validator, play entry audio, wait for learner action, loop hint audio after a countdown, play success feedback, complete the panel, and let OnboardingManager advance.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px "Inter", "Segoe UI", Arial, sans-serif; fill: #142033; }
      .subtitle { font: 400 15px "Inter", "Segoe UI", Arial, sans-serif; fill: #566273; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .lane-label { font: 700 12px "Inter", "Segoe UI", Arial, sans-serif; fill: #64748b; letter-spacing: .4px; }
      .box { fill: #ffffff; stroke: #5f6b7a; stroke-width: 1.5; }
      .manager { fill: #eef6ff; stroke: #2563eb; }
      .panel { fill: #ecfdf5; stroke: #059669; }
      .condition { fill: #fff7ed; stroke: #d97706; }
      .feedback { fill: #fff1f2; stroke: #e11d48; }
      .external { fill: #f8fafc; stroke: #475569; }
      .label { font: 700 15px "Inter", "Segoe UI", Arial, sans-serif; fill: #111827; }
      .small { font: 400 12px "Inter", "Segoe UI", Arial, sans-serif; fill: #334155; }
      .edge { fill: none; stroke: #475569; stroke-width: 1.75; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #b45309; stroke-width: 1.75; marker-end: url(#arrow-amber); }
      .event { fill: none; stroke: #0f766e; stroke-width: 1.75; marker-end: url(#arrow-teal); }
      .label-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: .8; }
      .edge-label { font: 700 11px "Inter", "Segoe UI", Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="760" />
  <text class="title" x="70" y="60">Condition-Gated Progression Flow</text>
  <text class="subtitle" x="70" y="88">One onboarding task panel advances only after the intended XR or UI action is validated.</text>

  <rect class="lane" x="60" y="125" width="1280" height="145" rx="8" />
  <text class="lane-label" x="85" y="153">ONBOARDING MANAGER</text>

  <rect class="lane" x="60" y="305" width="1280" height="275" rx="8" />
  <text class="lane-label" x="85" y="333">ENTRY AUDIO + CONDITION HINT LOOP PANEL</text>

  <rect class="lane" x="60" y="615" width="1280" height="80" rx="8" />

  <rect class="box manager" x="95" y="172" width="190" height="70" rx="8" />
  <text class="label" x="190" y="199" text-anchor="middle">Prepare Panel</text>
  <text class="small" x="190" y="222" text-anchor="middle">set active + visual ready</text>

  <rect class="box manager" x="1115" y="172" width="190" height="70" rx="8" />
  <text class="label" x="1210" y="199" text-anchor="middle">GoNext</text>
  <text class="small" x="1210" y="222" text-anchor="middle">transition to next panel</text>

  <rect class="box panel" x="95" y="370" width="180" height="78" rx="8" />
  <text class="label" x="185" y="398" text-anchor="middle">Reset Validator</text>
  <text class="small" x="185" y="421" text-anchor="middle">OnTaskPanelPrepared</text>

  <rect class="box panel" x="325" y="370" width="180" height="78" rx="8" />
  <text class="label" x="415" y="398" text-anchor="middle">Play Entry Audio</text>
  <text class="small" x="415" y="421" text-anchor="middle">until audio ends or success</text>

  <polygon class="box condition" points="635,350 750,409 635,468 520,409" />
  <text class="label" x="635" y="403" text-anchor="middle">Condition</text>
  <text class="label" x="635" y="424" text-anchor="middle">Satisfied?</text>

  <rect class="box condition" x="815" y="370" width="170" height="78" rx="8" />
  <text class="label" x="900" y="398" text-anchor="middle">Countdown</text>
  <text class="small" x="900" y="421" text-anchor="middle">default 10 seconds</text>

  <rect class="box feedback" x="1030" y="370" width="180" height="78" rx="8" />
  <text class="label" x="1120" y="398" text-anchor="middle">Play Hint Audio</text>
  <text class="small" x="1120" y="421" text-anchor="middle">guide retry</text>

  <rect class="box feedback" x="815" y="490" width="170" height="70" rx="8" />
  <text class="label" x="900" y="517" text-anchor="middle">Visual Feedback</text>
  <text class="small" x="900" y="540" text-anchor="middle">move to pinch pose</text>

  <rect class="box feedback" x="1030" y="490" width="180" height="70" rx="8" />
  <text class="label" x="1120" y="517" text-anchor="middle">Success Audio</text>
  <text class="small" x="1120" y="540" text-anchor="middle">PlayingSuccessAudio</text>

  <rect class="box panel" x="1225" y="490" width="80" height="70" rx="8" />
  <text class="label" x="1265" y="517" text-anchor="middle">Complete</text>
  <text class="small" x="1265" y="540" text-anchor="middle">event</text>

  <rect class="box external" x="160" y="635" width="250" height="42" rx="8" />
  <text class="small" x="285" y="660" text-anchor="middle">OVRInput: both controllers disconnected</text>

  <rect class="box external" x="510" y="635" width="250" height="42" rx="8" />
  <text class="small" x="635" y="660" text-anchor="middle">IndexPinchSelector + IHand pinch pose</text>

  <rect class="box external" x="890" y="635" width="250" height="42" rx="8" />
  <text class="small" x="1015" y="660" text-anchor="middle">PointableCanvasButton click/select</text>

  <path class="edge" d="M 190 242 V 370" />
  <path class="edge" d="M 275 409 H 325" />
  <path class="edge" d="M 505 409 H 520" />
  <path class="edge" d="M 750 409 H 815" />
  <rect class="label-bg" x="766" y="388" width="34" height="20" rx="6" />
  <text class="edge-label" x="783" y="402" text-anchor="middle">no</text>

  <path class="loop" d="M 985 409 H 1030" />
  <path class="loop" d="M 1210 409 H 1220 V 315 H 635 V 350" />
  <rect class="label-bg" x="1016" y="304" width="84" height="20" rx="6" />
  <text class="edge-label" x="1058" y="318" text-anchor="middle">retry check</text>

  <path class="event" d="M 635 468 V 525 H 815" />
  <rect class="label-bg" x="649" y="492" width="36" height="20" rx="6" />
  <text class="edge-label" x="667" y="506" text-anchor="middle">yes</text>

  <path class="edge" d="M 985 525 H 1030" />
  <path class="edge" d="M 1210 525 H 1225" />
  <path class="event" d="M 1265 490 V 286 H 1210 V 242" />
  <rect class="label-bg" x="1278" y="346" width="68" height="20" rx="6" />
  <text class="edge-label" x="1312" y="360" text-anchor="middle">completed</text>

  <path class="edge" d="M 285 635 V 610 H 635 V 468" />
  <path class="edge" d="M 635 635 V 468" />
  <path class="edge" d="M 1015 635 V 610 H 635 V 468" />

  <rect class="label-bg" x="74" y="319" width="302" height="20" rx="4" />
  <text class="lane-label" x="85" y="333">ENTRY AUDIO + CONDITION HINT LOOP PANEL</text>

  <rect class="label-bg" x="74" y="614" width="226" height="20" rx="4" />
  <text class="lane-label" x="85" y="628">CONDITION VALIDATOR ADAPTERS</text>

</svg>
