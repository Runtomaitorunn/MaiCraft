<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc" viewBox="0 0 1400 780">
  <title id="pipeline-title">Onboarding Animation Production Pipeline</title>
  <desc id="pipeline-desc">A pipeline diagram showing the two onboarding animation production paths. Controller-off guidance is captured from live XR hands and controllers, saved as animation clips, rebuilt into a direct blend tree animator, previewed in the editor, and used in runtime guidance. Pinch guidance is baked from a right-hand rig into open and loop clips controlled by an IsPinching parameter and driven by OnboardingPinchAnimPlayer.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .title { font: 700 34px "Inter", "Segoe UI", Arial, sans-serif; fill: #142033; }
      .subtitle { font: 400 15px "Inter", "Segoe UI", Arial, sans-serif; fill: #566273; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .lane-label { font: 700 12px "Inter", "Segoe UI", Arial, sans-serif; fill: #64748b; letter-spacing: .4px; }
      .box { fill: #ffffff; stroke: #5f6b7a; stroke-width: 1.5; }
      .capture { fill: #eef6ff; stroke: #2563eb; }
      .process { fill: #fff7ed; stroke: #d97706; }
      .asset { fill: #ecfdf5; stroke: #059669; }
      .runtime { fill: #ecfeff; stroke: #0891b2; }
      .qa { fill: #fff1f2; stroke: #e11d48; }
      .label { font: 700 15px "Inter", "Segoe UI", Arial, sans-serif; fill: #111827; }
      .small { font: 400 12px "Inter", "Segoe UI", Arial, sans-serif; fill: #334155; }
      .edge { fill: none; stroke: #475569; stroke-width: 1.75; marker-end: url(#arrow); }
      .edge-soft { fill: none; stroke: #64748b; stroke-width: 1.45; marker-end: url(#arrow-soft); }
      .label-bg { fill: #f7f9fc; stroke: #e2e8f0; stroke-width: .8; }
      .edge-label { font: 700 11px "Inter", "Segoe UI", Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="780" />
  <text class="title" x="70" y="60">Animation Production Pipeline</text>
  <text class="subtitle" x="70" y="88">Two editor-time paths produce lightweight runtime guidance for hand-tracking onboarding.</text>

  <rect class="lane" x="55" y="130" width="1290" height="265" rx="8" />
  <text class="lane-label" x="80" y="158">CONTROLLER-OFF GUIDANCE: PLAY MODE CAPTURE TO BLEND TREE</text>

  <rect class="lane" x="55" y="430" width="1290" height="230" rx="8" />
  <text class="lane-label" x="80" y="458">PINCH GUIDANCE: EDITOR BAKER TO BOOLEAN ANIMATOR STATE</text>

  <rect class="box capture" x="85" y="205" width="185" height="88" rx="8" />
  <text class="label" x="177.5" y="234" text-anchor="middle">Live XR Sources</text>
  <text class="small" x="177.5" y="258" text-anchor="middle">OVRHand / OVRSkeleton</text>
  <text class="small" x="177.5" y="278" text-anchor="middle">controller anchors</text>

  <rect class="box capture" x="320" y="205" width="205" height="88" rx="8" />
  <text class="label" x="422.5" y="234" text-anchor="middle">Recorder</text>
  <text class="small" x="422.5" y="258" text-anchor="middle">sampleRate + duration</text>
  <text class="small" x="422.5" y="278" text-anchor="middle">hotkey / delayed start</text>

  <rect class="box process" x="575" y="205" width="205" height="88" rx="8" />
  <text class="label" x="677.5" y="234" text-anchor="middle">Curve Mapping</text>
  <text class="small" x="677.5" y="258" text-anchor="middle">local position / rotation</text>
  <text class="small" x="677.5" y="278" text-anchor="middle">finger bones + roots</text>

  <rect class="box asset" x="830" y="190" width="205" height="118" rx="8" />
  <text class="label" x="932.5" y="219" text-anchor="middle">Recorded Clips</text>
  <text class="small" x="932.5" y="243" text-anchor="middle">Hands_dropcontroller.anim</text>
  <text class="small" x="932.5" y="263" text-anchor="middle">Controllers_dropcontroller.anim</text>
  <text class="small" x="932.5" y="283" text-anchor="middle">smoothed AnimationCurves</text>

  <rect class="box asset" x="1085" y="190" width="220" height="118" rx="8" />
  <text class="label" x="1195" y="219" text-anchor="middle">OffController Animator</text>
  <text class="small" x="1195" y="243" text-anchor="middle">Direct BlendTree</text>
  <text class="small" x="1195" y="263" text-anchor="middle">HandsWeight / ControllersWeight</text>
  <text class="small" x="1195" y="283" text-anchor="middle">editor preview support</text>

  <rect class="box runtime" x="1085" y="330" width="220" height="45" rx="8" />
  <text class="small" x="1195" y="357" text-anchor="middle">Runtime controller-off guidance</text>

  <rect class="box capture" x="85" y="505" width="185" height="88" rx="8" />
  <text class="label" x="177.5" y="534" text-anchor="middle">Right Hand Rig</text>
  <text class="small" x="177.5" y="558" text-anchor="middle">PinchAnimObject</text>
  <text class="small" x="177.5" y="578" text-anchor="middle">or fallback prefab</text>

  <rect class="box process" x="320" y="505" width="205" height="88" rx="8" />
  <text class="label" x="422.5" y="534" text-anchor="middle">Pinch Baker</text>
  <text class="small" x="422.5" y="558" text-anchor="middle">bone deltas + hand Z keys</text>
  <text class="small" x="422.5" y="578" text-anchor="middle">ray + cursor feedback curves</text>

  <rect class="box asset" x="575" y="490" width="205" height="118" rx="8" />
  <text class="label" x="677.5" y="519" text-anchor="middle">Pinch Assets</text>
  <text class="small" x="677.5" y="543" text-anchor="middle">OnboardingPinch_R_Open</text>
  <text class="small" x="677.5" y="563" text-anchor="middle">OnboardingPinch_R_Loop</text>
  <text class="small" x="677.5" y="583" text-anchor="middle">OnboardingPinch_R.controller</text>

  <rect class="box asset" x="830" y="505" width="205" height="88" rx="8" />
  <text class="label" x="932.5" y="534" text-anchor="middle">Animator State</text>
  <text class="small" x="932.5" y="558" text-anchor="middle">OpenHand / PinchLoop</text>
  <text class="small" x="932.5" y="578" text-anchor="middle">IsPinching bool transition</text>

  <rect class="box runtime" x="1085" y="505" width="220" height="88" rx="8" />
  <text class="label" x="1195" y="534" text-anchor="middle">Pinch Anim Player</text>
  <text class="small" x="1195" y="558" text-anchor="middle">Play / Stop / SetPlaying</text>
  <text class="small" x="1195" y="578" text-anchor="middle">runtime tutorial guidance</text>

  <rect class="box qa" x="575" y="335" width="205" height="42" rx="8" />
  <text class="small" x="677.5" y="361" text-anchor="middle">Editor preview + device QA</text>

  <path class="edge" d="M 270 249 H 320" />
  <path class="edge" d="M 525 249 H 575" />
  <path class="edge" d="M 780 249 H 830" />
  <path class="edge" d="M 1035 249 H 1085" />
  <path class="edge-soft" d="M 1195 308 V 330" />

  <path class="edge-soft" d="M 677.5 293 V 335" />
  <rect class="label-bg" x="705" y="313" width="72" height="20" rx="6" />
  <text class="edge-label" x="741" y="327" text-anchor="middle">validate</text>

  <path class="edge" d="M 270 549 H 320" />
  <path class="edge" d="M 525 549 H 575" />
  <path class="edge" d="M 780 549 H 830" />
  <path class="edge" d="M 1035 549 H 1085" />

  <path class="edge-soft" d="M 1195 593 V 635 H 177.5 V 593" />
  <rect class="label-bg" x="584" y="624" width="94" height="20" rx="6" />
  <text class="edge-label" x="631" y="638" text-anchor="middle">tune and rebake</text>

</svg>
