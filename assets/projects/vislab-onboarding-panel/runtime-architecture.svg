<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="runtime-title runtime-desc" viewBox="0 0 1400 860">
  <title id="runtime-title">Onboarding Runtime Architecture UML</title>
  <desc id="runtime-desc">A UML-like component and class diagram for the onboarding scene. It shows OnboardingManager orchestration, panel lifecycle events, task panel variants, condition validators, navigation controls, remote control hooks, telemetry, scene navigation, XR visual readiness, and login handoff.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .title { font: 700 34px "Inter", "Segoe UI", Arial, sans-serif; fill: #142033; }
      .subtitle { font: 400 15px "Inter", "Segoe UI", Arial, sans-serif; fill: #566273; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .frame-title { font: 700 12px "Inter", "Segoe UI", Arial, sans-serif; fill: #64748b; letter-spacing: .4px; }
      .box { fill: #ffffff; stroke: #5f6b7a; stroke-width: 1.5; }
      .blue { fill: #eef6ff; stroke: #2563eb; }
      .green { fill: #ecfdf5; stroke: #059669; }
      .amber { fill: #fff7ed; stroke: #d97706; }
      .teal { fill: #ecfeff; stroke: #0891b2; }
      .rose { fill: #fff1f2; stroke: #e11d48; }
      .slate { fill: #f8fafc; stroke: #475569; }
      .stereo { font: 700 11px "Inter", "Segoe UI", Arial, sans-serif; fill: #64748b; letter-spacing: .35px; }
      .label { font: 700 15px "Inter", "Segoe UI", Arial, sans-serif; fill: #111827; }
      .small { font: 400 12px "Inter", "Segoe UI", Arial, sans-serif; fill: #334155; }
      .edge { fill: none; stroke: #475569; stroke-width: 1.7; marker-end: url(#arrow); }
      .edge-soft { fill: none; stroke: #64748b; stroke-width: 1.4; marker-end: url(#arrow-soft); }
      .inherit { fill: none; stroke: #475569; stroke-width: 1.5; marker-end: url(#triangle); }
      .event { fill: none; stroke: #0f766e; stroke-width: 1.6; marker-end: url(#arrow-teal); }
      .label-bg { fill: #f7f9fc; stroke: #e2e8f0; stroke-width: .8; }
      .edge-label { font: 700 11px "Inter", "Segoe UI", Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e" />
    </marker>
    <marker id="triangle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f7f9fc" stroke="#475569" stroke-width="1.2" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="860" />
  <text id="runtime-main-title" class="title" x="70" y="60">Runtime Architecture UML</text>
  <text class="subtitle" x="70" y="88">00_OnboardingScene: scene orchestration, panel lifecycle, condition adapters, navigation, telemetry, and login handoff.</text>

  <rect class="frame" x="55" y="120" width="1290" height="650" rx="8" />
  <text class="frame-title" x="80" y="148">SCENE RUNTIME</text>

  <rect class="box amber" x="90" y="190" width="230" height="112" rx="8" />
  <text class="stereo" x="205" y="216" text-anchor="middle">&lt;&lt;navigation surface&gt;&gt;</text>
  <text class="label" x="205" y="244" text-anchor="middle">OnboardingNavigationBinder</text>
  <text class="small" x="205" y="268" text-anchor="middle">StageRequested / SkipRequested</text>
  <text class="small" x="205" y="288" text-anchor="middle">blocks input during transitions</text>

  <rect class="box amber" x="90" y="340" width="230" height="95" rx="8" />
  <text class="stereo" x="205" y="365" text-anchor="middle">&lt;&lt;stage button&gt;&gt;</text>
  <text class="label" x="205" y="392" text-anchor="middle">StageBlock</text>
  <text class="small" x="205" y="416" text-anchor="middle">PointableCanvasButton state</text>

  <rect class="box rose" x="90" y="500" width="230" height="96" rx="8" />
  <text class="stereo" x="205" y="525" text-anchor="middle">&lt;&lt;operator hook&gt;&gt;</text>
  <text class="label" x="205" y="552" text-anchor="middle">RemoteControlEventBus</text>
  <text class="small" x="205" y="576" text-anchor="middle">next / previous / reset / skip</text>

  <rect class="box blue" x="410" y="260" width="260" height="146" rx="8" />
  <text class="stereo" x="540" y="288" text-anchor="middle">&lt;&lt;scene orchestrator&gt;&gt;</text>
  <text class="label" x="540" y="318" text-anchor="middle">OnboardingManager</text>
  <text class="small" x="540" y="346" text-anchor="middle">panels[] + stageEntries[]</text>
  <text class="small" x="540" y="368" text-anchor="middle">transition coroutine + delay</text>
  <text class="small" x="540" y="390" text-anchor="middle">jump / reset / skip / login handoff</text>

  <rect class="box green" x="760" y="185" width="240" height="124" rx="8" />
  <text class="stereo" x="880" y="212" text-anchor="middle">&lt;&lt;abstract lifecycle&gt;&gt;</text>
  <text class="label" x="880" y="241" text-anchor="middle">OnboardingPanel</text>
  <text class="small" x="880" y="268" text-anchor="middle">Prepare / Begin / Cleanup</text>
  <text class="small" x="880" y="288" text-anchor="middle">Next / Previous / Completion</text>

  <rect class="box green" x="760" y="380" width="240" height="126" rx="8" />
  <text class="stereo" x="880" y="407" text-anchor="middle">&lt;&lt;abstract task panel&gt;&gt;</text>
  <text class="label" x="880" y="436" text-anchor="middle">OnboardingTaskPanel</text>
  <text class="small" x="880" y="463" text-anchor="middle">RunTask coroutine</text>
  <text class="small" x="880" y="483" text-anchor="middle">audio + condition helpers</text>

  <rect class="box teal" x="1090" y="185" width="210" height="124" rx="8" />
  <text class="stereo" x="1195" y="212" text-anchor="middle">&lt;&lt;condition seam&gt;&gt;</text>
  <text class="label" x="1195" y="241" text-anchor="middle">ConditionValidator</text>
  <text class="small" x="1195" y="268" text-anchor="middle">IsSatisfied</text>
  <text class="small" x="1195" y="288" text-anchor="middle">Reset + last pinch pose</text>

  <rect class="box teal" x="1090" y="380" width="210" height="126" rx="8" />
  <text class="stereo" x="1195" y="407" text-anchor="middle">&lt;&lt;validator adapters&gt;&gt;</text>
  <text class="small" x="1195" y="433" text-anchor="middle">ControllerOffHandsValidator</text>
  <text class="small" x="1195" y="457" text-anchor="middle">PinchValidator</text>
  <text class="small" x="1195" y="481" text-anchor="middle">ButtonSelectionValidator</text>

  <rect class="box slate" x="760" y="575" width="240" height="108" rx="8" />
  <text class="stereo" x="880" y="601" text-anchor="middle">&lt;&lt;panel variants&gt;&gt;</text>
  <text class="small" x="880" y="627" text-anchor="middle">EntryAudio / Video auto-advance</text>
  <text class="small" x="880" y="651" text-anchor="middle">Animated entry overlay</text>
  <text class="small" x="880" y="675" text-anchor="middle">Condition hint + success panels</text>

  <rect class="box slate" x="1090" y="575" width="210" height="108" rx="8" />
  <text class="stereo" x="1195" y="601" text-anchor="middle">&lt;&lt;XR interaction&gt;&gt;</text>
  <text class="small" x="1195" y="627" text-anchor="middle">OVRInput controller state</text>
  <text class="small" x="1195" y="651" text-anchor="middle">IndexPinchSelector / IHand</text>
  <text class="small" x="1195" y="675" text-anchor="middle">PointableCanvasButton click</text>

  <rect class="box blue" x="410" y="555" width="260" height="112" rx="8" />
  <text class="stereo" x="540" y="581" text-anchor="middle">&lt;&lt;AppService boundary&gt;&gt;</text>
  <text class="label" x="540" y="610" text-anchor="middle">Telemetry + SceneNavigation</text>
  <text class="small" x="540" y="636" text-anchor="middle">Record panel enter / exit</text>
  <text class="small" x="540" y="656" text-anchor="middle">Load 01_LoginScene</text>

  <path class="edge" d="M 320 246 H 380 V 296 H 410" />
  <rect class="label-bg" x="337" y="225" width="60" height="20" rx="6" />
  <text class="edge-label" x="367" y="239" text-anchor="middle">requests</text>

  <path class="edge" d="M 320 548 H 365 V 333 H 410" />
  <rect class="label-bg" x="331" y="488" width="70" height="20" rx="6" />
  <text class="edge-label" x="366" y="502" text-anchor="middle">commands</text>

  <path class="edge-soft" d="M 205 340 V 302" />
  <rect class="label-bg" x="166" y="312" width="78" height="20" rx="6" />
  <text class="edge-label" x="205" y="326" text-anchor="middle">child input</text>

  <path class="edge" d="M 670 333 H 720 V 247 H 760" />
  <rect class="label-bg" x="682" y="312" width="48" height="20" rx="6" />
  <text class="edge-label" x="706" y="326" text-anchor="middle">drives</text>

  <path class="event" d="M 760 225 H 540 V 260" />
  <rect class="label-bg" x="615" y="204" width="70" height="20" rx="6" />
  <text class="edge-label" x="650" y="218" text-anchor="middle">events</text>

  <path class="inherit" d="M 880 380 V 309" />
  <rect class="label-bg" x="848" y="337" width="64" height="20" rx="6" />
  <text class="edge-label" x="880" y="351" text-anchor="middle">extends</text>

  <path class="inherit" d="M 880 575 V 506" />
  <rect class="label-bg" x="848" y="532" width="64" height="20" rx="6" />
  <text class="edge-label" x="880" y="546" text-anchor="middle">extends</text>

  <path class="edge" d="M 1000 443 H 1090" />
  <rect class="label-bg" x="1026" y="422" width="40" height="20" rx="6" />
  <text class="edge-label" x="1046" y="436" text-anchor="middle">uses</text>

  <path class="inherit" d="M 1195 380 V 309" />
  <rect class="label-bg" x="1163" y="337" width="64" height="20" rx="6" />
  <text class="edge-label" x="1195" y="351" text-anchor="middle">extends</text>

  <path class="edge-soft" d="M 1195 575 V 506" />
  <rect class="label-bg" x="1152" y="532" width="86" height="20" rx="6" />
  <text class="edge-label" x="1195" y="546" text-anchor="middle">observes XR</text>

  <path class="edge" d="M 540 406 V 555" />
  <rect class="label-bg" x="496" y="472" width="88" height="20" rx="6" />
  <text class="edge-label" x="540" y="486" text-anchor="middle">records / loads</text>

  <path class="edge-soft" d="M 670 611 H 735 V 286 H 760" />
  <rect class="label-bg" x="678" y="575" width="74" height="20" rx="6" />
  <text class="edge-label" x="715" y="589" text-anchor="middle">panel ids</text>

  <path class="inherit" d="M 1045 733 H 1095" />
  <text class="tiny" x="1105" y="737">hollow triangle = extends</text>

</svg>
