<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="user-flow-title user-flow-desc" viewBox="0 0 1400 760">
  <title id="user-flow-title">Self-Guided Onboarding User Flow UML</title>
  <desc id="user-flow-desc">A UML-like user flow for the GAVIS onboarding scene. It moves from shared headset setup to app introduction, controller-down guidance, hand tracking, pinch practice, safety notice, and login handoff.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px "Inter", "Segoe UI", Arial, sans-serif; fill: #142033; }
      .subtitle { font: 400 15px "Inter", "Segoe UI", Arial, sans-serif; fill: #566273; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .lane-label { font: 700 12px "Inter", "Segoe UI", Arial, sans-serif; fill: #64748b; letter-spacing: .4px; }
      .box { fill: #ffffff; stroke: #5f6b7a; stroke-width: 1.5; }
      .setup { fill: #eef6ff; stroke: #2563eb; }
      .practice { fill: #ecfdf5; stroke: #059669; }
      .decision { fill: #fff7ed; stroke: #d97706; }
      .notice { fill: #fff1f2; stroke: #e11d48; }
      .handoff { fill: #ecfeff; stroke: #0891b2; }
      .label { font: 700 15px "Inter", "Segoe UI", Arial, sans-serif; fill: #111827; }
      .small { font: 400 12px "Inter", "Segoe UI", Arial, sans-serif; fill: #334155; }
      .edge { fill: none; stroke: #475569; stroke-width: 1.75; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #b45309; stroke-width: 1.75; marker-end: url(#arrow-amber); }
      .handoff-edge { fill: none; stroke: #0f766e; stroke-width: 1.75; marker-end: url(#arrow-teal); }
      .label-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: .8; }
      .edge-label { font: 700 11px "Inter", "Segoe UI", Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="760" />
  <text class="title" x="70" y="60">Self-Guided Onboarding User Flow</text>
  <text class="subtitle" x="70" y="88">From staff-dependent first use to an in-headset rehearsal before login.</text>

  <rect class="lane" x="55" y="125" width="1290" height="150" rx="8" />
  <text class="lane-label" x="80" y="153">SHARED CLASSROOM SETUP</text>

  <rect class="lane" x="55" y="320" width="1290" height="250" rx="8" />
  <text class="lane-label" x="80" y="348">INTERACTIVE ONBOARDING PANEL</text>

  <rect class="lane" x="55" y="615" width="1290" height="80" rx="8" />
  <text class="lane-label" x="80" y="643">APP ENTRY</text>

  <rect class="box setup" x="95" y="180" width="185" height="70" rx="8" />
  <text class="label" x="187.5" y="208" text-anchor="middle">Headset On</text>
  <text class="small" x="187.5" y="231" text-anchor="middle">shared device context</text>

  <rect class="box setup" x="340" y="180" width="205" height="70" rx="8" />
  <text class="label" x="442.5" y="208" text-anchor="middle">Open GAVIS</text>
  <text class="small" x="442.5" y="231" text-anchor="middle">English learning app</text>

  <rect class="box setup" x="605" y="180" width="215" height="70" rx="8" />
  <text class="label" x="712.5" y="208" text-anchor="middle">Start Onboarding</text>
  <text class="small" x="712.5" y="231" text-anchor="middle">before login</text>

  <rect class="box practice" x="95" y="390" width="190" height="78" rx="8" />
  <text class="label" x="190" y="418" text-anchor="middle">App Context</text>
  <text class="small" x="190" y="441" text-anchor="middle">what GAVIS expects</text>

  <rect class="box practice" x="345" y="390" width="190" height="78" rx="8" />
  <text class="label" x="440" y="418" text-anchor="middle">Put Down</text>
  <text class="label" x="440" y="438" text-anchor="middle">Controllers</text>

  <rect class="box practice" x="595" y="390" width="190" height="78" rx="8" />
  <text class="label" x="690" y="418" text-anchor="middle">Use Hands</text>
  <text class="small" x="690" y="441" text-anchor="middle">hand tracking ready</text>

  <polygon class="box decision" points="910,370 1025,429 910,488 795,429" />
  <text class="label" x="910" y="422" text-anchor="middle">Pinch UI</text>
  <text class="label" x="910" y="443" text-anchor="middle">Button?</text>

  <rect class="box notice" x="1090" y="390" width="190" height="78" rx="8" />
  <text class="label" x="1185" y="418" text-anchor="middle">Safety Notice</text>
  <text class="small" x="1185" y="441" text-anchor="middle">classroom use rules</text>

  <rect class="box handoff" x="595" y="625" width="210" height="55" rx="8" />
  <text class="label" x="700" y="649" text-anchor="middle">Login Handoff</text>
  <text class="small" x="700" y="667" text-anchor="middle">learner enters app</text>

  <path class="edge" d="M 280 215 H 340" />
  <path class="edge" d="M 545 215 H 605" />
  <path class="edge" d="M 712.5 250 V 320 H 190 V 390" />
  <path class="edge" d="M 285 429 H 345" />
  <path class="edge" d="M 535 429 H 595" />
  <path class="edge" d="M 785 429 H 795" />
  <path class="edge" d="M 1025 429 H 1090" />
  <rect class="label-bg" x="1038" y="408" width="36" height="20" rx="6" />
  <text class="edge-label" x="1056" y="422" text-anchor="middle">yes</text>

  <path class="loop" d="M 910 488 V 535 H 690 V 468" />
  <rect class="label-bg" x="762" y="524" width="96" height="20" rx="6" />
  <text class="edge-label" x="810" y="538" text-anchor="middle">retry with hint</text>

  <path class="handoff-edge" d="M 1185 468 V 650 H 805" />
  <path class="handoff-edge" d="M 700 625 V 570 H 1185 V 468" />
  <rect class="label-bg" x="848" y="631" width="94" height="20" rx="6" />
  <text class="edge-label" x="895" y="645" text-anchor="middle">ready to log in</text>
</svg>
